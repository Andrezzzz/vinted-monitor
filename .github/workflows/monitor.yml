name: Monitor Vinted

on:
  schedule:
    - cron: "0 * * * *"   # ogni ora (GitHub puo' ritardare di qualche minuto)
  workflow_dispatch:       # avvio manuale dalla scheda Actions

concurrency:
  group: monitor-vinted
  cancel-in-progress: false

permissions:
  contents: write          # serve per salvare visti.json nel repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Avvia monitor per ~55 minuti
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py durata 3300

      - name: Salva annunci gia' visti
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add visti.json || true
          git diff --cached --quiet || git commit -m "Aggiorna visti.json"
          git pull --rebase -X theirs || true
          git push || true
