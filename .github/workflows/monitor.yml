name: Monitor Vinted

on:
  schedule:
    - cron: "7,27,47 * * * *"   # riserva: evita l'ora esatta (congestionata); se il monitor gira gia' resta in coda
  workflow_dispatch:       # avvio manuale dalla scheda Actions

concurrency:
  group: monitor-vinted
  cancel-in-progress: false

permissions:
  contents: write          # serve per salvare visti.json nel repo
  actions: write           # serve per riavviare il workflow a fine giro

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Avvia monitor per ~55 minuti
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py durata 3300

      - name: Salva annunci gia' visti
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add visti.json || true
          git diff --cached --quiet || git commit -m "Aggiorna visti.json"
          git pull --rebase -X theirs || true
          git push || true

      # GitHub salta spesso gli avvii programmati: ogni giro riuscito avvia
      # subito il successivo. Il cron sopra resta come riserva se la catena
      # si interrompe (errore o annullamento manuale).
      - name: Avvia il giro successivo
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # l'API di GitHub ogni tanto risponde 502: riprova qualche volta
          for tentativo in 1 2 3 4 5 6; do
            gh workflow run monitor.yml --ref main && exit 0
            echo "Tentativo $tentativo fallito, riprovo tra $((tentativo * 20)) secondi."
            sleep $((tentativo * 20))
          done
          exit 1
